# .github/workflows/docker-publish.yml

name: Build and Push to Docker Hub

on:
  push:
    branches:
      - main  
  workflow_dispatch: # 允许手动触发

jobs:
  build_and_push:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # git describe 需要 tag 历史（版本号注入用，见 Resolve version）
          fetch-depth: 0

      - name: Resolve version
        id: version
        # 版本号单一事实源 = git tag（本工作流跑 main 分支，通常得
        # v3.0.0-rc.N-M-gSHA 形态的 dev 串，发版以 v3 CI 的 tag 构建为准）。
        run: echo "value=$(git describe --tags --always)" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            TG_FORWARDER_VERSION=${{ steps.version.outputs.value }}
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/tgf:latest
          platforms: linux/amd64,linux/arm64 # 构建多种架构

      - name: Delete workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
            retain_days: 0
            keep_minimum_runs: 2