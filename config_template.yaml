# TG Ultimate Forwarder - 终极转发器 配置文件
# 适配版本: v5.9 / v8.x
# 💡 提示: 复杂的转发规则、过滤、源和目标配置已移至 Web 面板 (http://localhost:8080) 管理。
# 此文件仅用于配置最基础的启动参数和账号连接。

# --- 1. 系统基础配置 ---
docker_container_name: "tgf" # 容器名称 (用于交互式登录提示)

# 日志级别 (INFO/WARNING/ERROR)
logging_level:
  app: "INFO"
  telethon: "WARNING"

# Web 控制台密码 (http://localhost:8080)
# [重要] 首次启动前请修改
web_ui:
  password: "password"

# --- 2. Bot 服务 (推荐启用) ---
# 用于接收通知和简单的状态查询
bot_service:
  enabled: true
  bot_token: "123456789:ABC-DEF1234567890" # 从 @BotFather 获取
  # 管理员 ID (数字)，只有在此列表中的用户才能控制 Bot
  admin_user_ids:
    - 123456789 

# --- 3. 账号配置 (必需) ---
# 用于监听和转发的 Userbot 账号
accounts:
  - api_id: 123456                  # 从 my.telegram.org 获取
    api_hash: "0123456789abcdef..." 
    session_name: "account_1"       # 会话文件名 (不带后缀)
    enabled: true

# --- 4. 代理配置 (可选) ---
# proxy:
#   enabled: false
#   proxy_type: "socks5"
#   addr: "127.0.0.1"
#   port: 1080
#   username: ""
#   password: ""

# =====================================================
# 以下配置项已移交 Web 面板数据库管理
# 为了通过配置校验，此处保留最小化的空结构，请勿在此修改
# =====================================================

sources: [] # 请在 Web 面板添加监控源

targets:
  default_target: 0 # 占位符，请在 Web 面板设置实际目标

# 下列功能默认值即可，具体策略在 Web 面板调整
forwarding:
  mode: "copy" 
  forward_new_only: true

ad_filter:
  enable: true

content_filter:
  enable: true

whitelist:
  enable: false

deduplication:
  enable: true
  # F12 语义去重（fastembed 向量相似度；默认关，模型缺失/加载失败自动降级为不启用）
  semantic_dedup_enabled: false
  # F12 相似度阈值（>= 判重；Web 面板「实验功能」可调并落表覆盖此默认值）
  semantic_dedup_threshold: 0.85

link_extraction:
  check_hyperlinks: false

link_checker:
  enabled: false

# F10 AI digest（默认关=现网行为零变化；per 源开关 digest_enabled 经 yaml bootstrap 配置）
# 也可在 Web 面板「实验功能」里开关与调聚合间隔（落表覆盖 digest.enabled/interval_seconds）。
# 命名偏差说明：功能契约 digest_enabled/digest_interval 对应此处 enabled/interval_seconds；
# per 源开关字段名即契约名 digest_enabled（SourceConfig 字段，sources[i] 项里配）。
# 注意：Web 源表单不含 digest_enabled 字段，经 Web 新增/编辑源会按默认 false 保存并覆盖；
# 如需给某源开 digest，在首次 bootstrap 的 sources 段里配置 digest_enabled: true。
# digest:
#   enabled: false
#   interval_seconds: 1800          # 滚动窗口间隔（秒）
#   base_url: "http://100.64.0.2:8091/v1"  # OpenAI 兼容端点（axonhub）
#   model: "glm-5.3-flash"          # 免费模型
#   # api_key: ""                   # 端点需鉴权时填写（可选）

# F11 AI 翻译（默认关=现网行为零变化；经 yaml bootstrap 配置）
# 字段说明：sources=要翻译的监控源 resolved_id 列表（留空=不翻译任何源）；
# endpoint/model=OpenAI 兼容端点（默认 axonhub glm-5.3-flash，免费）；
# api_key=**直填 Bearer 密钥（首选）**，写在本文件——它被 .gitignore 忽略：
#   不进 git 仓库、不进面板 sqlite、不会出现在 /api/settings 响应里。
#   留空/不写(None)才回退读 api_key_env 环境变量；显式填 "" = 明确禁用鉴权。
# api_key_env=api_key 为空时要读的环境变量名（备选通道；容器重建需重新 -e 注入）。
# 翻译失败/端点不可用一律原文放行，绝不丢消息；结果有缓存避免重复计费。
# 也可在 Web 面板「实验功能」里开关翻译并维护源列表（settings.translate_sources
# 落表后覆盖本段 sources；未存过则回落 yaml 实际值）。**面板不提供 key 输入**。
# translate:
#   enabled: false
#   sources: []                    # 例: [-1001234567890, "https://t.me/xxx"]
#   endpoint: "http://100.64.0.2:8091/v1"
#   api_key: ""                    # 首选：直填 key（照抄留 "" = 不带鉴权，下面的 api_key_env 会被忽略！）
#   api_key_env: "AXONHUB_API_KEY" # 备选：api_key 留空时读这个环境变量
#   model: "glm-5.3-flash"

# AI 广告判别器（jev-1.13 System One 决策模型；默认关=现网行为零变化）。
# 转发前判断消息是否广告，是则过滤（位置：should_filter 之后、去重之前）。
# fail-open：jev 判定模糊/超时/异常 → None → 消息放行，绝不因 AI 不可用丢消息。
# threshold=广告判定阈值（>= 判广告，默认 0.85；实测硬广 0.98+、正常 0.03-0.07、
#   「附网盘链接」0.69 在模糊区）；fuzzy_low=模糊区下界（[fuzzy_low, threshold) 放行）。
# 配置来源二选一：yaml 本段（首次 bootstrap）或 Web 面板「AI 判别」tab（落表后以其为准，
# 未在面板保存过的键保持 yaml 值）；两者改后均即时热重载生效，无需重启容器。
# ad_judge:
#   enabled: false
#   base_url: "http://100.64.0.2:28880"   # 本机 opencode-free 容器（无需 key）
#   model: "jev-1.13"
#   threshold: 0.85
#   fuzzy_low: 0.60                      # 必须 <= threshold（否则模糊区反转，配置校验直接拒绝）
#   timeout: 20

# F14 AI 结构化内容处理（OpenAI 兼容端点；默认关=现网行为零变化）。
# 一次模型调用同时产出「广告判定 + 清洗正文」，输出为结构化 JSON：
#   {"is_ad":bool,"ad_type":str,"confidence":0~1,"cleaned_text":str,"reason":str}
# 与 F13 的关键差异：丢弃与否由本地按 confidence >= threshold 决定，不采信模型自行
# 拍板或返回哨兵串（模型误吐哨兵串会静默丢消息，撞本项目 fail-open 铁律）。
# 判据措辞沿用 F13 于 2026-09-23 实测标定的版本（锚定「商业广告/引流牟利」，
# 资源分享 0.23-0.38 放行、卖号硬广 0.98 拦、群推广 0.86 拦）。
# clean_enabled=false 即退化为「只判广告不改文」，改正文前建议先小流量试。
# json_mode 下发 response_format=json_object；端点不支持会 4xx，此时关掉本项
# 退回纯提示词模式（模型仍输出 JSON，解析层容错代码围栏与前后解说）。
# ai_content:
#   enabled: false
#   base_url: "http://100.64.0.2:8091/v1" # OpenAI 兼容基址，程序自动拼 /chat/completions
#   api_key: ""                          # 首选：直填 Bearer 密钥（不进仓库/不进面板/不被 GET 回读）
#                                        #   照抄留 "" = 不带鉴权，下面的 api_key_env 会被忽略！
#   api_key_env: "AXONHUB_API_KEY"       # 备选：api_key 留空时读这个环境变量；再空则静默降级
#   model: "glm-5.3-flash"
#   threshold: 0.85                        # confidence >= 此值才拦截，低于即放行
#   clean_enabled: true                    # 是否采用模型返回的清洗正文
#   timeout: 8
#   json_mode: true
#   min_ratio: 0.3                         # 清洗后长度占比下界，过短=内容截失→弃用
#   max_ratio: 2.0                         # 上界，过长=模型跑偏→弃用（必须 > min_ratio）
#   max_text_chars: 4096                   # 送模型的最大长度；**超过此值的正文只判广告不改文**
#                                          #   —— 模型只看得到前缀，让它改写会抹掉没看见的尾巴
#   sources: []                            # 空=全部源；非空仅对列表内源生效
#   cache_max_entries: 256
#   cache_ttl_seconds: 3600
